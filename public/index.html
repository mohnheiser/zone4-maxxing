<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZONE 4 MAXXING // Live Puls</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Top Navigation & Gruppen-Stats -->
  <header class="topbar">
    <div class="brand">
      <span class="logo">ZONE 4 MAXXING</span>
      <span id="modeBadge" class="badge">CONNECTING...</span>
    </div>

    <div class="stats-summary">
      <div class="stat-item">
        <span class="stat-label">🔥 IN ZONE 4/5</span>
        <span id="inZoneCount" class="stat-value highlight">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">GRUPPEN-Ø</span>
        <span id="groupAvgBpm" class="stat-value">-- BPM</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">TEILNEHMER</span>
        <span id="totalAthletes" class="stat-value">0</span>
      </div>
    </div>

    <button id="fullscreenBtn" class="btn">Vollbild ⛶</button>
  </header>

  <!-- Kachel-Grid -->
  <main>
    <div id="tilesContainer" class="grid-container">
      <!-- Kacheln werden via app.js eingefügt -->
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
